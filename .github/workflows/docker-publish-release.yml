name: Build and Push Valhalla Docker Images

# Publish fork release-tagged images for the cluster.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  GHCR_USER: ${{ secrets.GHCR_USER }}
  CONTAINER_NAME: benciks/valhalla

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          raw_tag="${GITHUB_REF#refs/tags/}"
          version="${raw_tag#*@}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_modifier=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Publish the plain image first because the scripted image uses it as its base.
      - name: Build and push plain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION_MODIFIER=${{ steps.version.outputs.version_modifier }}
          tags: |
            ghcr.io/${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.CONTAINER_NAME }}:latest

      - name: Build and push scripted image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile-scripted
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VALHALLA_BUILDER_IMAGE=ghcr.io/${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ env.CONTAINER_NAME }}-scripted:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.CONTAINER_NAME }}-scripted:latest
